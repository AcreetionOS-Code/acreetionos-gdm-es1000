Section "Device"
    Identifier  "ES1000"
    Driver      "radeon"
    BusID       "PCI:1:3:0"
    Option      "AccelMethod"        "EXA"
    Option      "SWCursor"           "on"
    Option      "TearFree"          "on"
    Option      "SwapbuffersWait"   "off"
    Option      "EnablePageFlip"    "on"
    Option      "EXAPixmaps"        "on"
EndSection
