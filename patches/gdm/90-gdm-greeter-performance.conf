# Performance settings for GDM greeter on ES1000
# Force GL version to avoid compatibility checks
MESA_GL_VERSION_OVERRIDE=3.3
MESA_GLSL_VERSION_OVERRIDE=330
# Skip GL error checking
MESA_NO_ERROR=1
# Limit software rendering to 1 thread (single-core CPU)
LP_NUM_THREADS=1
# Disable vsync
vblank_mode=0
# Force X11 backend for clutter
CLUTTER_BACKEND=x11
# Use Mesa GL
__GLX_VENDOR_LIBRARY_NAME=mesa
